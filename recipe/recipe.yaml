schema_version: 1

context:
  name: jupyterlab_templates
  version: "0.5.3"

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: c7c68e61f8eaa6f0d69a9117e9945a3bdbf01ab425c51386c0027f85a8f6eae4

build:
  number: 1

outputs:
  - package:
      name: jupyterlab_templates
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
    requirements:
      host:
        - python ${{ python_min }}.*
        - pip
        - nodejs
        - yarn
        - hatchling >=1.3.1
        - hatch-jupyter-builder
        - jupyterlab >=4,<5
      run:
        - python >=${{ python_min }}
        - jupyterlab >=4,<5
    tests:
      - python:
          imports:
            - jupyterlab_templates
          python_version:
            - ${{ python_min }}.*

  - package:
      name: jupyterlab-templates
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage("jupyterlab_templates", exact=True) }}

about:
  homepage: https://github.com/finos/jupyterlab_templates
  license: Apache-2.0
  license_file: LICENSE
  summary: Jupyter notebook templates
  description: Jupyter notebook templates
  repository: https://github.com/finos/jupyterlab_templates

extra:
  feedstock-name: jupyterlab_templates
  recipe-maintainers:
    - timkpaine
